# netlify.toml: how Netlify builds and serves this site. [build] holds the build command and the
# folders, [build.environment] the Node version, and each [[headers]] block one path's headers.
# To change it: edit the block concerned, then run `netlify build` to check it. This file is
# public, so no secret goes here: anything private is a variable on the Netlify project.
# The build command starts with shared/scripts/check-mui-api.mjs, which stops on an old MUI name in under a
# second, and ends with scripts/check-public.mjs, which stops a build that would publish something
# private. Keep both in this command: `netlify build` and `netlify deploy` both run it, and a
# predeploy npm script would only run under `npm run deploy`. See the README, The public check.

[build]
  command = "node shared/scripts/check-mui-api.mjs && npm run build && node scripts/check-public.mjs"
  functions = "netlify/functions"
  publish = "build"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://docs.netlify.com/configure-builds/file-based-configuration/

[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/docs/dp/"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

    #  Multi-value headers are expressed with multi-line strings
    cache-control = '''
    max-age=0,
    no-cache,
    no-store,
    must-revalidate'''

[[headers]]
  for = "/docs/backtracking/"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

    #  Multi-value headers are expressed with multi-line strings
    cache-control = '''
    max-age=0,
    no-cache,
    no-store,
    must-revalidate'''
